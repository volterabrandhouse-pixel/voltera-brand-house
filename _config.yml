# Voltera Brand House — Jekyll Configuration
title: "Voltera Brand House"
description: "Digital Growth & Business Promotion for ambitious brands, restaurants, cafes, retail shops and local businesses. Content creation, Instagram growth, and paid promotion that turns your page into a real sales channel."
url: "https://volterabrandhouse-pixel.github.io"
baseurl: "/voltera-brand-house"

author:
  name: "Tushar Bhardwaj"
  email: "Tusharbwaj2004@gmail.com"
  phone: "+91 86038 34423"
  instagram: "valtera.brandhouse"

markdown: kramdown
highlighter: rouge
permalink: pretty


plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

twitter:
  card: summary_large_image
social:
  name: Voltera Brand House
  links:
    - https://instagram.com/valtera.brandhouse

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - "*.pdf"
  - "*.ps1"
  - "*.bin"
  - "*.zip"
  - poppler/